<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Sync</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #f3f3f3;
        font-family: sans-serif;
      }

      .presence {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 10px 12px;
        border-radius: 6px;
        background: rgb(0 0 0 / 55%);
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }

      .presence h1 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
      }

      .presence li {
        list-style: none;
        margin: 0;
        padding: 2px 0;
      }

      .presence ul {
        margin: 0;
        padding: 0;
      }

      .presence .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        vertical-align: middle;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
